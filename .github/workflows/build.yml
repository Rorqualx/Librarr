# Librarr build pipeline — Phase 0 skeleton.
#
# Goal: prove that the inherited `./build.sh` and `./test.sh` scripts run
# green on GitHub Actions runners. Multi-OS matrix, packaging, installer
# signing, and release publishing are deliberately out of scope here and
# will be added in Phase 9 alongside the version reset to 1.0.0-beta.1.
#
# Cross-reference: ../../azure-pipelines.yml is the upstream Azure
# Pipelines definition, kept as a stage-for-stage reference during the
# Phase 0 cutover.

name: Build

on:
  push:
    branches:
      - develop
      - main
      - 'librarr/**'
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'src/Readarr.Api.*/openapi.json'
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'src/Readarr.Api.*/openapi.json'
  workflow_dispatch:

env:
  # Keep in sync with azure-pipelines.yml:28 (`dotnetVersion`) and
  # global.json until that file is removed.
  DOTNET_VERSION: '10.0.x'
  # Node 20 went EOL 2026-04-30. 24 is the current LTS (until 2028-04-30),
  # which outlives the .NET 10 support window this repo is pinned to.
  # Keep in sync with .nvmrc, package.json `engines`/`volta`, and
  # distribution/docker/Dockerfile.
  NODE_VERSION: '24.x'
  # Phase 9 version reset. The fork starts its own 1.0.0-beta.x line
  # rather than continuing the inherited Readarr 0.4.x numbering — the
  # metadata-source overhaul + UI wizard + the fork's CI/branding/CLA
  # changes are a different product even if the codebase is shared.
  # GITHUB_RUN_NUMBER acts as the build counter (1.2.3-beta.N).
  # release.yml does NOT read this — it takes the version from the tag
  # name — so this line only sets what untagged dev builds call
  # themselves. Bump it when a release tag moves the line forward.
  MAJOR_VERSION: '1.2.3-beta'

jobs:
  variables:
    name: Set variables
    runs-on: ubuntu-22.04
    outputs:
      readarrVersion: ${{ steps.set.outputs.readarrVersion }}
    steps:
      - id: set
        shell: bash
        run: |
          VERSION="${MAJOR_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "readarrVersion=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${VERSION}"

  build-backend:
    name: Build backend (Linux)
    needs: variables
    runs-on: ubuntu-22.04
    env:
      READARRVERSION: ${{ needs.variables.outputs.readarrVersion }}
      # StyleCop runs only on the Linux leg upstream — mirror that here.
      EnableAnalyzers: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build backend
        shell: bash
        # --enable-extra-platforms (freebsd-x64 + linux-x86) is deferred:
        # the .NET SDK stopped shipping runtime packs for those RIDs. The
        # two escape hatches this comment used to name are both spent --
        # global.json now pins the SDK and the target framework is net10.0 --
        # so re-enabling means patching the SDK's bundled-versions file,
        # which build.sh already does behind
        # `--enable-extra-platforms-in-sdk`. There used to be a step here
        # that inlined that patch by hand; it selected the SDK with
        # `find | head -1`, which on a runner carrying three SDKs picked
        # 8.0.423 while the build ran on 10.0.302, and then reported
        # success. Deleted rather than repaired -- build.sh owns this.
        run: ./build.sh --backend

      - name: Upload backend output
        uses: actions/upload-artifact@v7
        with:
          name: backend-linux
          path: |
            _output/
            _tests/
          retention-days: 7
          if-no-files-found: error

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Build frontend
        shell: bash
        env:
          FORCE_COLOR: '0'
        run: ./build.sh --frontend

      - name: Upload UI output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-ui
          path: _output/UI/
          retention-days: 7
          if-no-files-found: error

  unit-tests:
    name: Unit tests (Linux)
    needs: build-backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download backend output
        uses: actions/download-artifact@v8
        with:
          name: backend-linux
          path: .

      - name: Restore exec bits on published test artifacts
        # actions/upload-artifact strips POSIX exec bits on non-Windows.
        # test.sh + Readarr.Test.Dummy need them back before invocation.
        shell: bash
        run: |
          chmod +x test.sh
          chmod +x _tests/net10.0/linux-x64/publish/Readarr.Test.Dummy 2>/dev/null || true

      - name: Run unit tests with coverage
        shell: bash
        env:
          # Per azure-pipelines.yml:1219 — test.sh's assembly-discovery loop
          # expects the test DLLs at $TEST_DIR/<DLL>.dll, which after build
          # live under _tests/net10.0/<rid>/publish/. Without this, vstest
          # is handed nonexistent file paths and reports "Failed tests: 1"
          # while exiting 0 — i.e., the suite never actually runs.
          #
          # Which is exactly what happened: the .NET 10 migration left this at
          # net6.0 and this job has been failing on main ever since, with the
          # symptom the comment above already described.
          TEST_DIR: _tests/net10.0/linux-x64/publish
        run: ./test.sh Linux Unit Coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: |
            TestResult.xml
            TestLog.txt
          retention-days: 7
          if-no-files-found: ignore

  unit-tests-debug:
    # Issue #12. The "Unit tests (Linux)" job above runs the *published
    # Release* artifacts, so BuildInfo.IsDebug is false and LoggingTest's
    # AssertNoUnexpectedLogs teardown — the assertion that fails a test which
    # logged an undeclared Warn/Error/Fatal — never fires there. Eleven such
    # tests rode into main that way before anyone noticed (see #11). This job
    # builds and runs the unit suites in Debug so that assertion is actually
    # exercised on every push.
    #
    # Separate from the Release coverage job on purpose: a log-assertion
    # failure and a coverage/packaging problem should never be the same red X.
    # It builds straight from source (no artifact dependency, so it starts in
    # parallel) and excludes Category=IntegrationTest so it stays fast and
    # network-free — the third-party suites have their own jobs.
    name: Unit tests (Debug — log assertions)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build the solution (Debug)
        shell: bash
        # Build the whole solution, not just the test projects: AutoMoqer
        # reflection-loads the platform shim (Readarr.Mono on Linux) by name
        # rather than referencing it, so `dotnet test <Core.Test.csproj>`
        # alone never builds it and every CoreTest<T> then dies in setup with
        # "Could not load file or assembly 'Readarr.Mono'". OutputPath is a
        # shared dir (no $(Configuration)/per-project split), so a full build
        # lands Readarr.Mono.dll beside the test assembly where Assembly.Load
        # finds it — which is what the published-artifact flow relies on too.
        run: dotnet build src/Readarr.sln -c Debug

      - name: Common.Test (Debug)
        shell: bash
        run: dotnet test src/NzbDrone.Common.Test/Readarr.Common.Test.csproj -c Debug --no-build --filter 'Category!=IntegrationTest'

      - name: Core.Test (Debug)
        # always(), so a Common.Test failure still yields the Core result
        # rather than masking it.
        if: always()
        shell: bash
        run: dotnet test src/NzbDrone.Core.Test/Readarr.Core.Test.csproj -c Debug --no-build --filter 'Category!=IntegrationTest'

  unit-tests-postgres:
    # Librarr advertises SQLite *and* PostgreSQL, but until this job existed
    # nothing in the fork had ever been executed against PostgreSQL: the
    # upstream jobs that did it (azure-pipelines.yml, "Unit Native LinuxCore
    # with Postgres14/15 Database") stopped running when that pipeline was
    # retired, and every migration and query added since was only ever read.
    #
    # Two halves, both against a real server:
    #   1. Core.Test with Readarr__Postgres__Host set. DbTest
    #      (src/NzbDrone.Core.Test/Framework/DbTest.cs) switches every
    #      DbTest-derived fixture, including the migration fixtures, to
    #      PostgreSQL as soon as that variable is non-empty, creating and
    #      dropping a database per test. The whole assembly runs rather than
    #      a hand-kept list of fixtures, so a new DbTest is covered without
    #      anyone remembering to add it here.
    #   2. The published app booted on empty databases, so all migrations
    #      are applied by the real host, then its API and housekeeping are
    #      exercised (tests/e2e/postgres-boot.sh).
    #
    # Versions: upstream tested 14 and 15. This runs the oldest and the
    # newest major PostgreSQL still supports, which brackets the rest.
    #
    # The server's time zone is deliberately not UTC, as it was upstream:
    # `timestamp without time zone` columns only misbehave when the server
    # and the app disagree about the zone, and a UTC server hides that.
    name: Unit tests (PostgreSQL ${{ matrix.postgres }})
    needs: build-backend
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: readarr
          POSTGRES_PASSWORD: readarr
          TZ: America/Chicago
          PGTZ: America/Chicago
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readarr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The variables PostgresOptions.GetOptions() binds ("Readarr:Postgres").
      # The test framework and the app read the same ones.
      Readarr__Postgres__Host: localhost
      Readarr__Postgres__Port: '5432'
      Readarr__Postgres__User: readarr
      Readarr__Postgres__Password: readarr
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download backend output
        uses: actions/download-artifact@v8
        with:
          name: backend-linux
          path: .

      - name: Restore exec bits on published artifacts
        # actions/upload-artifact strips POSIX exec bits on non-Windows.
        shell: bash
        run: |
          chmod +x _output/net10.0/linux-x64/publish/Readarr
          chmod +x _tests/net10.0/linux-x64/publish/Readarr.Test.Dummy 2>/dev/null || true

      - name: Show the server under test
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U readarr -d postgres -Atc "select version(); show timezone;"

      - name: Core.Test against PostgreSQL
        shell: bash
        env:
          # As test.sh does: keep the per-test log (every SQL statement,
          # with DbTest's LogSql on) out of the console.
          READARR_TESTS_LOG_OUTPUT: File
        run: |
          dotnet test _tests/net10.0/linux-x64/publish/Readarr.Core.Test.dll \
            --filter 'Category!=ManualTest&Category!=WINDOWS&Category!=IntegrationTest&Category!=AutomationTest' \
            --logger 'nunit;LogFilePath=PostgresTestResult.xml' \
            --logger 'console;verbosity=minimal'

      - name: Create the app's databases
        # always(): the boot check below is independent evidence, so a red
        # test step should not hide whether the app itself comes up.
        if: always()
        shell: bash
        run: |
          # The app migrates its databases but does not create them. These
          # are ConfigFileProvider's default names.
          for db in readarr-main readarr-log readarr-cache; do
            docker exec "${{ job.services.postgres.id }}" \
              psql -U readarr -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$db\" WITH OWNER = readarr ENCODING = 'UTF8';"
          done

      - name: Boot the app on PostgreSQL and exercise it
        if: always()
        shell: bash
        run: bash tests/e2e/postgres-boot.sh

      - name: Check every migration in the tree was applied by the app
        # /system/status cannot answer this. It reports the highest applied
        # version, and that is pinned at 158 by an inherited misnumbering
        # (034_cdh_per_downloadclient.cs is [Migration(158)]), so it reads the
        # same whether or not the newest migrations ran. Compare the whole
        # list instead, in the main and the log database.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -n 's/.*\[Migration(0*\([0-9][0-9]*\))\].*/\1/p' \
            src/NzbDrone.Core/Datastore/Migration/[0-9]*_*.cs | sort -n | grep -vx 0)
          echo "Migrations in the tree: $(wc -l <<<"$expected")"
          for db in readarr-main readarr-log; do
            applied=$(docker exec "${{ job.services.postgres.id }}" \
              psql -U readarr -d "$db" -v ON_ERROR_STOP=1 -Atc 'select "Version" from "VersionInfo" order by 1' | grep -vx 0)
            echo "Applied in $db: $(wc -l <<<"$applied")"
            diff <(echo "$expected") <(echo "$applied")
          done

      - name: Dump the migrated schema of the fork's tables
        if: always()
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U readarr -d readarr-main -c '\d "BookIdMapping"' -c '\d "Narrators"' -c '\d "EditionNarrators"' || true
          docker exec "${{ job.services.postgres.id }}" \
            psql -U readarr -d readarr-log -c '\d "UpdateHistory"' || true

      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-postgres-${{ matrix.postgres }}
          path: |
            **/PostgresTestResult.xml
          retention-days: 7
          if-no-files-found: ignore

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile

      - name: ESLint
        shell: bash
        run: yarn lint

      - name: Stylelint
        shell: bash
        run: yarn stylelint-linux

  test-frontend:
    # The frontend had no automated coverage of any kind until this job
    # existed -- no jest, no vitest, no test file anywhere under frontend/.
    # Separate from lint-frontend so a failing assertion and a style
    # violation are never reported as the same red X.
    name: Unit tests (frontend)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Install dependencies
        shell: bash
        run: yarn install --frozen-lockfile

      - name: Vitest
        shell: bash
        run: yarn test:frontend

  e2e-smoke:
    # Phase 8 exit criterion: one e2e smoke run per CI build. Boots the
    # published linux-x64 backend artifact, asserts the API surface
    # responds, and fires the ReidentifyLibrary command (fire-and-forget).
    # Failures here are distinct from unit-test failures — they catch
    # "the artifact CI built doesn't actually run" regressions that the
    # unit suite can't see.
    name: E2E smoke
    needs: build-backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download backend output
        uses: actions/download-artifact@v8
        with:
          name: backend-linux
          path: .

      - name: Restore exec bit on Readarr binary
        # actions/upload-artifact strips POSIX exec bits on non-Windows.
        shell: bash
        run: chmod +x _output/net10.0/linux-x64/publish/Readarr

      - name: Run smoke script
        shell: bash
        run: bash tests/e2e/smoke.sh

  windows-smoke:
    # Nothing Windows-specific executed anywhere before this job: every test
    # job above is ubuntu-22.04, so every WindowsOnly() test (37 call sites)
    # ignored itself on every run, and release.yml builds the Windows zips and the
    # installer but only checks that the files exist. Service mode, the
    # installer and the Windows platform shim had not run once since the move
    # from .NET 6 to .NET 10.
    #
    # Builds on Windows rather than reusing backend-linux, because that
    # artifact cannot stand in: the tray application targets net10.0-windows
    # and only publishes from a Windows host, and build.sh's PackageWindows
    # needs that publish to assemble the folder users actually get. The build
    # line is the one release.yml's build-windows job uses, so what is tested
    # here is the shipped layout, not an approximation of it.
    #
    # The steps after the build are independent of each other (each runs
    # unless the build itself failed), so one run reports on all of them.
    name: Windows smoke
    needs: variables
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      READARRVERSION: ${{ needs.variables.outputs.readarrVersion }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build + package win-x64
        id: build
        shell: bash
        # One RID per invocation: under Git Bash a semicolon-separated RID
        # list does not survive the trip to dotnet.exe (see build.sh).
        # No frontend: /ping and the API do not need it, and PackageFiles
        # leaves an empty UI folder in its place.
        run: ./build.sh --backend --packages -f net10.0 -r win-x64

      - name: Work out the version the binaries should report
        id: version
        shell: bash
        # The same transformation build.sh's UpdateVersionNumber applies
        # before writing AssemblyVersion.
        run: echo "assembly=$(echo "$READARRVERSION" | sed 's/-[A-Za-z][A-Za-z0-9]*//')" >> "$GITHUB_OUTPUT"

      - name: Unit tests (Windows)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        env:
          TEST_DIR: _tests/net10.0/win-x64/publish
        # test.sh's Windows filter drops Category=LINUX instead of
        # Category=WINDOWS, and on this host WindowsOnly() fixtures run
        # instead of ignoring themselves.
        run: ./test.sh Windows Unit Test

      - name: Smoke - console
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >
          ./tests/e2e/windows-smoke.ps1 -Stage console
          -App _artifacts/win-x64/net10.0/Readarr
          -ExpectedVersion '${{ steps.version.outputs.assembly }}'

      - name: Smoke - Windows service
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: >
          ./tests/e2e/windows-smoke.ps1 -Stage service
          -App _artifacts/win-x64/net10.0/Readarr
          -ExpectedVersion '${{ steps.version.outputs.assembly }}'

      - name: Smoke - migrate-readarr-folder.ps1
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/e2e/windows-smoke.ps1 -Stage migrate

      - name: Compile the installer
        id: installer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        # ISCC directly rather than `build.sh --installer`, which also builds
        # the win-x86 installer this job has no package for. Inno Setup is
        # preinstalled on windows-2022.
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup 6 (ISCC.exe) is not installed on this runner' }
          & $iscc distribution\windows\setup\readarr.iss /DFramework=net10.0 /DRuntime=win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem distribution\windows\setup\output\*-installer.exe | Select-Object -First 1
          if (-not $exe) { throw 'ISCC succeeded but produced no installer' }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "$($exe.Name) $([math]::Round($exe.Length / 1MB)) MB"

      - name: Smoke - installer
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        shell: pwsh
        run: >
          ./tests/e2e/windows-smoke.ps1 -Stage installer
          -Installer '${{ steps.installer.outputs.path }}'
          -ExpectedVersion '${{ steps.version.outputs.assembly }}'

      - name: Upload logs and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke
          path: |
            _smoke/
            TestResult.xml
            TestLog.txt
          retention-days: 7
          if-no-files-found: ignore

  integration-tests:
    # `Category=IntegrationTest` ran in no job at all — the unit job
    # excludes it explicitly. In practice that meant HttpClientFixture's
    # 54 tests had never executed in CI, which is how one of them sat
    # three weeks past a hard-coded cookie expiry without anyone noticing.
    #
    # READARR_RUN_INTEGRATION is deliberately NOT set here. That leaves
    # NzbDrone.Integration.Test's 94 tests ignored by their own gate and
    # confines this job to the fixtures that do not touch OpenLibrary.
    # The gate documents why: running those 94 in one pass got the source
    # IP refused by openlibrary.org on 26 of 88 tests, and the refusals
    # persisted for minutes. They run one fixture at a time in
    # .github/workflows/nightly-integration.yml instead — hammering a free
    # public service on every push is not a reasonable thing to do.
    name: Integration tests (network)
    needs: build-backend
    runs-on: ubuntu-22.04
    # Non-blocking on purpose. Every test here reaches a third-party host,
    # so red can mean "their server is down" as readily as "we broke
    # something", and a suite that reddens for reasons the committer
    # cannot fix is one people learn to ignore. The win is that these run
    # at all and their result is visible on every build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download backend output
        uses: actions/download-artifact@v8
        with:
          name: backend-linux
          path: .

      - name: Restore exec bits on published test artifacts
        shell: bash
        run: |
          chmod +x test.sh
          chmod +x _tests/net10.0/linux-x64/publish/Readarr.Test.Dummy 2>/dev/null || true

      - name: Run integration-category tests
        shell: bash
        env:
          TEST_DIR: _tests/net10.0/linux-x64/publish
        run: ./test.sh Linux Integration Test

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-integration
          path: |
            TestResult.xml
            TestLog.txt
          retention-days: 7
          if-no-files-found: ignore

  playwright:
    # The Playwright smoke suite ran in no CI job at all. It is gated
    # behind READARR_RUN_PLAYWRIGHT=1 so a bare `dotnet test` skips it,
    # and nothing ever set that — which is precisely the blind spot three
    # of the .NET 10 migration misses survived in.
    #
    # Split by network dependence rather than by convenience. Ten of the
    # sixteen tests drive a local instance only; those block the build.
    # The other six seed a library through the API, which is a live
    # OpenLibrary fetch, so they run as a step that is allowed to fail.
    # A third party rate-limiting us is not a reason to redden main, and
    # a suite that goes red for reasons the committer cannot fix is a
    # suite people learn to ignore.
    name: Playwright smoke
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Read the pinned Playwright version
        id: pw
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/.*PackageVersion Include="Microsoft.Playwright" Version="\([^"]*\)".*/\1/p' \
                src/Directory.Packages.props | head -1)
          [ -n "$v" ] || { echo "could not read the Microsoft.Playwright pin" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache the Chromium bundle
        # Keyed on the pin: a version bump must download its own browser
        # rather than silently reuse the previous one. That mismatch is
        # exactly what produced "Executable doesn't exist" locally.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Download backend output
        uses: actions/download-artifact@v8
        with:
          name: backend-linux
          path: .

      - name: Download UI output
        uses: actions/download-artifact@v8
        with:
          name: frontend-ui
          path: _output/UI

      - name: Assemble the tree NzbDroneRunner expects
        shell: bash
        run: |
          set -euo pipefail
          app=_tests/net10.0/linux-x64/bin
          # In Release the runner launches <testdir>/../bin/Readarr and
          # asserts a UI sits beside it. A full ./build.sh produces that
          # via PackageFiles(); this pipeline runs --backend only, so
          # assemble it from the two artifacts rather than pay for a
          # second full build.
          #
          # cp -a preserves mtimes deliberately: the runner's staleness
          # guard fails when _output/UI is NEWER than the copy beside the
          # binary, and a plain cp would make every run look stale.
          mkdir -p "$app"
          cp -a _output/net10.0/linux-x64/publish/. "$app/"
          cp -a _output/UI "$app/UI"
          # upload-artifact strips POSIX exec bits on non-Windows.
          chmod +x "$app/Readarr"

      - name: Install Chromium
        shell: bash
        run: bash scripts/playwright-install.sh --with-deps

      - name: Put the Playwright driver beside the published test assembly
        shell: bash
        run: |
          set -euo pipefail
          # The Microsoft.Playwright build targets drop .playwright into the
          # framework build output, NOT into the per-RID publish folder that
          # PublishAllRids produces and that this job runs from. _AssemblyGate
          # looks for it next to its own assembly, so without this the whole
          # suite fails in OneTimeSetUp with "Playwright driver not found" --
          # which is exactly how this surfaced, the guard doing its job.
          src=_tests/net10.0/.playwright
          dst=_tests/net10.0/linux-x64/publish/.playwright
          if [ ! -d "$src" ]; then
            echo "No Playwright driver at $src." >&2
            echo "The install step builds the test project, which is what drops it." >&2
            exit 1
          fi
          rm -rf "$dst"
          cp -a "$src" "$dst"
          # The bundled node ships without an exec bit through this path.
          find "$dst" -path '*/node/*' -name node -type f -exec chmod +x {} +

      - name: Playwright — no network (blocking)
        shell: bash
        env:
          READARR_RUN_PLAYWRIGHT: '1'
        run: |
          dotnet test _tests/net10.0/linux-x64/publish/Readarr.Playwright.Test.dll \
            --filter 'Category!=RequiresOpenLibrary' \
            --logger 'nunit;LogFilePath=PlaywrightResult.xml'

      - name: Playwright — live OpenLibrary (non-blocking)
        # always(), so a failure in the blocking step above still yields
        # the full picture instead of one step's worth of it.
        if: always()
        continue-on-error: true
        shell: bash
        env:
          READARR_RUN_PLAYWRIGHT: '1'
        run: |
          dotnet test _tests/net10.0/linux-x64/publish/Readarr.Playwright.Test.dll \
            --filter 'Category=RequiresOpenLibrary' \
            --logger 'nunit;LogFilePath=PlaywrightOpenLibraryResult.xml'

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            **/PlaywrightResult.xml
            **/PlaywrightOpenLibraryResult.xml
          retention-days: 7
          if-no-files-found: ignore

  sbom:
    # Phase 10: SBOM artifact. Captures the .NET + Node dependency trees
    # at every successful build for supply-chain auditing. No publish
    # action — the SBOM is an artifact attached to the run.
    name: SBOM
    needs:
      - build-backend
      - build-frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-sbom-tool
        shell: bash
        run: dotnet tool install --global Microsoft.Sbom.DotNetTool

      - name: Generate .NET SBOM
        shell: bash
        run: |
          mkdir -p _sbom
          dotnet sbom-tool generate \
            -b src \
            -bc src \
            -m _sbom/dotnet \
            -pn Librarr \
            -pv "${MAJOR_VERSION}.${GITHUB_RUN_NUMBER}" \
            -ps "Librarr Project" \
            -nsb https://github.com/Rorqualx/Librarr || echo "sbom-tool returned non-zero; continuing"

      - name: Install Node SBOM tool (syft)
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate Node SBOM
        shell: bash
        run: |
          mkdir -p _sbom/node
          syft dir:. \
            --output spdx-json=_sbom/node/sbom-node.spdx.json \
            --output cyclonedx-json=_sbom/node/sbom-node.cdx.json \
            --exclude '_output/**' \
            --exclude '_tests/**' \
            --exclude 'src/**' \
            --exclude '.git/**' || echo "syft returned non-zero; continuing"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: _sbom/
          retention-days: 90
          if-no-files-found: warn
