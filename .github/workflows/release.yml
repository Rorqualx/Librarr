# Librarr release pipeline — Phase 9 closeout.
#
# Fires on `v*` tag push (or manual workflow_dispatch). Produces:
#   * Per-RID tarballs / zips for all 12 platforms the project targets
#     (mirrors azure-pipelines.yml:266-373).
#   * SHA256SUMS file aggregating the archive checksums.
#   * Windows installers (win-x64 / win-x86) built with Inno Setup from
#     distribution/windows/setup/readarr.iss.
#   * Authenticode signatures on the Windows binaries and installers,
#     when the WINDOWS_CERT_PFX + WINDOWS_CERT_PASSWORD secrets are set.
#     Without them everything still builds, just unsigned.
#   * A draft GitHub release with the tarballs + zips + installers +
#     SHA256SUMS attached. Draft so the user reviews notes before publish.
#   * Multi-arch Docker manifest (linux/amd64, linux/arm64, linux/arm/v7)
#     built from distribution/docker/Dockerfile, pushed to:
#       - ghcr.io/<owner>/librarr            (workflow GITHUB_TOKEN)
#       - docker.io/<DOCKERHUB_USERNAME>/librarr  (DOCKERHUB_TOKEN secret)
#     Image tags via docker/metadata-action, derived from the computed
#     version rather than the ref so a manual run tags like a tag push:
#     :<version>, :v<version>, :beta on beta versions, and :<major>.<minor>
#     plus :latest only on a plain x.y.z.
#
# Explicitly out of scope (TODO with required secrets noted inline):
#   * macOS .app notarization via notarytool
#   * Sentry source-map upload (azure-pipelines.yml:377-393)
#
# Side effects, so nobody is surprised by them: the GitHub release is
# created as a DRAFT and needs a human to publish it, but the Docker images
# are PUBLIC THE MOMENT THE JOB FINISHES -- build-push-action runs with
# `push: true`. (This comment used to say `push:false`, which stopped
# being true when the push was switched on.) What bounds that: the push
# only runs after the packaging job has succeeded, and only after the same
# job has built the image for the runner's own platform, started it, and
# seen it answer /ping and report the version being released.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without leading v — e.g. 1.0.0-beta.1)'
        required: true

env:
  # Pinned 2026-10-25: 10.0.x resolved to 10.0.403, whose files returned
  # HTTP 409 from Microsoft's origin while the release metadata still listed
  # 10.0.402. Go back to '10.0.x' once 10.0.403 (or later) downloads.
  DOTNET_VERSION: '10.0.402'
  # See the note in build.yml — Node 20 is EOL, 24 is LTS until 2028-04-30.
  NODE_VERSION: '24.x'

# Read-only by default. The two jobs that publish something ask for what
# they need themselves: `package` (contents: write, for the draft release)
# and `docker-multiarch` (packages: write, for GHCR). The build jobs run
# build.sh and third-party tooling and have no business holding either.
permissions:
  contents: read

jobs:
  variables:
    name: Compute release version
    runs-on: ubuntu-22.04
    permissions: {}
    outputs:
      version: ${{ steps.compute.outputs.version }}
      channel: ${{ steps.compute.outputs.channel }}
      branch: ${{ steps.compute.outputs.branch }}
    steps:
      - id: compute
        shell: bash
        env:
          # Through the environment, never interpolated into the script.
          # `${{ github.event.inputs.version }}` used to be pasted straight
          # into the `run:` text, so whatever was typed into the dispatch
          # form was executed as shell before anything looked at it.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Strip the leading "v" from refs/tags/vX.Y.Z
            VERSION="${GITHUB_REF_NAME#v}"
          else
            echo "::error::Release runs on a tag push or a manual dispatch, not on ${GITHUB_EVENT_NAME} of ${GITHUB_REF}."
            exit 1
          fi

          # x.y.z, optionally -alpha / -beta / -rc with an optional counter:
          # 1.2.3, 1.2.3-beta, 1.0.0-beta.4, 2.0.0-rc1. Every later job
          # trusts this value -- it becomes file names, a git tag, image
          # tags and an assembly version -- so it is checked once, here,
          # for both triggers. The pattern lives in a variable because
          # bash only treats the right-hand side of =~ as a regex when it
          # is unquoted, and an unquoted literal with parentheses is a
          # quoting accident waiting to happen.
          pattern='^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]*(\.[0-9]+)?)?$'
          if [[ ! "${VERSION}" =~ $pattern ]]; then
            echo "::error::Not a releasable version (expected e.g. 1.2.3 or 1.2.3-beta, without a leading v). Refusing to continue."
            exit 1
          fi

          # The pre-release word, or "stable". Drives the :latest and :beta
          # image tags. This used to be worked out from github.ref_name,
          # which on a manual run is the branch: no version tag came out at
          # all, and a beta dispatched from main was tagged :latest.
          CHANNEL="${BASH_REMATCH[2]:-stable}"

          # Recorded in the binaries as BuildInfo.Branch. A tag is not a
          # branch, so a tag build reports the branch releases are cut
          # from; a manual run reports the branch it was dispatched on.
          # Computed once here and handed to build.sh and to the Docker
          # build alike, so the tarballs, installers and images agree.
          # Keep in step with ResolveBuildBranch in build.sh.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            BRANCH="main"
          else
            BRANCH=$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')
          fi

          {
            echo "version=${VERSION}"
            echo "channel=${CHANNEL}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION} (channel: ${CHANNEL}, branch: ${BRANCH})"

  build-backend:
    name: Build backend (all RIDs)
    needs: variables
    runs-on: ubuntu-22.04
    env:
      READARRVERSION: ${{ needs.variables.outputs.version }}
      # build.sh records this as AssemblyConfiguration. See ResolveBuildBranch.
      BUILD_BRANCH: ${{ needs.variables.outputs.branch }}
      EnableAnalyzers: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build + package backend
        shell: bash
        # --enable-extra-platforms (freebsd-x64 + linux-x86) is deferred
        # for 1.0.0-beta — see build.yml for the rationale. The downstream
        # `package` job's tarball loop already handles missing per-RID
        # output paths with a WARN+skip, so the release artifact set
        # simply omits the two extras.
        run: ./build.sh --backend --packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: backend-artifacts
          path: _artifacts/
          retention-days: 7
          if-no-files-found: error

  build-windows:
    name: Build backend (Windows RIDs)
    needs: variables
    runs-on: windows-2022
    env:
      READARRVERSION: ${{ needs.variables.outputs.version }}
      # build.sh records this as AssemblyConfiguration. See ResolveBuildBranch.
      BUILD_BRANCH: ${{ needs.variables.outputs.branch }}
      EnableAnalyzers: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Why this job exists at all: the tray application
      # (src/NzbDrone/Readarr.csproj) targets net10.0-windows and only
      # publishes from a Windows runner. Without it, build.sh's
      # PackageWindows finds no _output/net10.0-windows/<rid>/publish and
      # deliberately skips the package rather than ship a Windows zip
      # missing Readarr.Windows.dll — which is why releases up to
      # 1.1.0-beta had no Windows asset.
      #
      # build.sh already knows how to do this: it detects a Windows host,
      # switches the msbuild platform to Windows, and PackageWindows merges
      # the net10.0-windows publish over the net10.0 console publish and
      # strips the Mono shim. Reuse it rather than restating the packaging
      # rules in YAML, where they would drift.
      #
      # One RID per invocation, deliberately. msbuild would happily take
      # `RuntimeIdentifiers=win-x64;win-x86`, but under Git Bash — which is
      # what `shell: bash` means on a Windows runner — MSYS re-marshals
      # arguments containing a semicolon on the way to dotnet.exe, and
      # msbuild fails with "MSB1006: Property is not valid. Switch:
      # win-x86". Verified by running it.
      #
      # Doing a full --backend --packages twice is safe: Build() wipes
      # _output and _tests, but never _artifacts, so the win-x64 package
      # survives the win-x86 pass.
      - name: Build + package win-x64
        shell: bash
        run: ./build.sh --backend --packages -f net10.0 -r win-x64

      - name: Build + package win-x86
        shell: bash
        run: ./build.sh --backend --packages -f net10.0 -r win-x86

      # Fail loudly here rather than silently shipping a broken zip. The
      # whole point of this job is Readarr.Windows.dll; if it is absent the
      # package is the exact artifact the old skip existed to prevent.
      - name: Verify the Windows platform shim made it into the package
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 win-x86; do
            pkg="_artifacts/${rid}/net10.0/Readarr"
            [ -d "$pkg" ] || { echo "ERROR: $pkg missing"; exit 1; }
            [ -f "$pkg/Readarr.Windows.dll" ] || { echo "ERROR: $pkg/Readarr.Windows.dll missing"; exit 1; }
            [ -f "$pkg/Readarr.exe" ] || { echo "ERROR: $pkg/Readarr.exe missing"; exit 1; }
            [ -f "$pkg/Readarr.Console.exe" ] || { echo "ERROR: $pkg/Readarr.Console.exe missing"; exit 1; }
            if [ -f "$pkg/Readarr.Mono.dll" ]; then
              echo "ERROR: $pkg still contains the Mono shim"; exit 1
            fi
            echo "  ${rid} OK"
          done

      # Before the upload, so the signed binaries are what both the portable
      # zips (built in `package`) and the installer (built in `installer`)
      # end up containing. Signing later would mean signing them twice or
      # shipping one of the two unsigned.
      #
      # No certificate configured => the script says so and exits 0, and the
      # release ships unsigned. To turn signing on, add two repository
      # secrets: WINDOWS_CERT_PFX (base64 of the .pfx) and
      # WINDOWS_CERT_PASSWORD. Nothing else here changes.
      - name: Authenticode-sign the Windows binaries
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ./distribution/windows/sign.ps1 -Path _artifacts

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: _artifacts/
          retention-days: 7
          if-no-files-found: error

  build-frontend:
    name: Build frontend
    needs: variables
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Build frontend
        shell: bash
        env:
          FORCE_COLOR: '0'
        run: ./build.sh --frontend

      - name: Upload UI output
        uses: actions/upload-artifact@v7
        with:
          name: frontend-artifacts
          path: _output/UI/
          retention-days: 7
          if-no-files-found: error

  installer:
    name: Windows installer
    # Downstream of build-windows deliberately: the installer packs whatever
    # that job produced, signatures included. Building it there instead would
    # mean waiting on the frontend before the Windows backend could start.
    needs: [variables, build-windows, build-frontend]
    runs-on: windows-2022
    env:
      READARRVERSION: ${{ needs.variables.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          path: _artifacts/

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-artifacts
          path: _output/UI/

      # Same staging the `package` job does before tarballing, for the same
      # reason: build.sh's PackageFiles() copies _output/UI into each per-RID
      # package during a `--packages` build, and we split backend and frontend
      # across separate jobs. The .iss pulls in
      # _artifacts\<rid>\net10.0\Readarr\* recursively, so the UI has to be
      # in place before ISCC runs or the installer ships a headless app.
      - name: Stage UI into each per-RID package
        shell: bash
        run: |
          set -euo pipefail
          for rid in win-x64 win-x86; do
            dest="_artifacts/${rid}/net10.0/Readarr/UI"
            mkdir -p "$dest"
            cp -r _output/UI/* "$dest/"
          done

      # Inno Setup is preinstalled on windows-2022 (6.7.1 at time of
      # writing), and build.sh uses it when present rather than downloading.
      - name: Build installers
        shell: bash
        run: ./build.sh --installer

      - name: Verify both installers were produced
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${READARRVERSION}"
          for rid in win-x64 win-x86; do
            exe="distribution/windows/setup/output/Librarr.${VERSION}.${rid}-installer.exe"
            [ -f "$exe" ] || { echo "ERROR: $exe missing"; exit 1; }
            echo "  $(basename "$exe") $(stat -c %s "$exe" 2>/dev/null || stat -f %z "$exe") bytes"
          done

      # The installer is the file most users actually download and the one
      # SmartScreen judges, so it needs its own signature -- signing the
      # payload does not sign the wrapper.
      - name: Authenticode-sign the installers
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $exes = Get-ChildItem distribution/windows/setup/output/*.exe
          ./distribution/windows/sign.ps1 -Path $exes.FullName

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installer-artifacts
          path: distribution/windows/setup/output/*.exe
          retention-days: 7
          if-no-files-found: error

  package:
    name: Tarball + draft release
    needs: [variables, build-backend, build-windows, build-frontend, installer]
    runs-on: ubuntu-22.04
    permissions:
      contents: write    # gh release create, and deleting a stale draft
    env:
      VERSION: ${{ needs.variables.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download backend artifacts
        uses: actions/download-artifact@v8
        with:
          name: backend-artifacts
          path: _artifacts/

      # Same _artifacts/ root, different RID subdirectories — the Linux job
      # skips win-x64/win-x86, so these two merge in without colliding.
      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-artifacts
          path: _artifacts/

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-artifacts
          path: _output/UI/

      # Straight into _release/ — these are finished assets, not something
      # the steps below repackage.
      - name: Download Windows installers
        uses: actions/download-artifact@v8
        with:
          name: installer-artifacts
          path: _release/

      - name: Stage UI into each per-RID package
        # build.sh PackageFiles() copies _output/UI into each
        # _artifacts/<rid>/<framework>/Readarr/ during a packages build.
        # We split backend/frontend across separate jobs, so re-stage
        # the UI before tarballing.
        shell: bash
        run: |
          for rid_dir in _artifacts/*/net10.0/Readarr; do
            [ -d "$rid_dir" ] || continue
            mkdir -p "$rid_dir/UI"
            cp -r _output/UI/* "$rid_dir/UI/"
          done

      - name: Assert the publish output is self-contained
        shell: bash
        run: |
          set -euo pipefail

          # 1.2.0-beta shipped framework-dependent by accident. .NET 7 dropped
          # the old rule that a RuntimeIdentifier implies SelfContained, so the
          # .NET 10 migration quietly cut every artifact from ~97 MB to ~25 MB
          # with no runtime inside. Nothing failed: the app builds, the tests
          # pass, and the E2E smoke boots it happily on a runner that already
          # has .NET installed. Only a user unpacking the tarball on a clean
          # machine would have found out.
          #
          # So assert on the artifact itself rather than trusting the property.
          # Native RIDs are checked for their host CLR; win-* carry the
          # Windows-native equivalent, hostfxr.dll.
          fail=0
          checked=0
          for rid_dir in _artifacts/*/net10.0/Readarr; do
            [ -d "$rid_dir" ] || continue
            checked=$((checked + 1))
            rid=$(basename "$(dirname "$(dirname "$rid_dir")")")
            case "$rid" in
              win-*)  probe=hostfxr.dll ;;
              osx-*)  probe=libcoreclr.dylib ;;
              *)      probe=libcoreclr.so ;;
            esac
            if [ -e "$rid_dir/$probe" ]; then
              echo "  ok    ${rid} (found ${probe})"
            else
              echo "::error::${rid} publish has no ${probe} - it is framework-dependent and will not run without a .NET install."
              fail=1
            fi
          done

          # A check that inspects nothing passes trivially, which is how the
          # original bug would have slipped past a sloppier version of this
          # step. The archive loops below cover 12 RIDs; anything under 10
          # means artifacts went missing and the assertion is not doing its job.
          echo "checked ${checked} publish directories"
          if [ "$checked" -lt 10 ]; then
            echo "::error::Only ${checked} publish directories found - expected at least 10. Refusing to vouch for artifacts that are not there."
            exit 1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Refusing to package a release that users cannot run. See SelfContained in src/Directory.Build.props."
            exit 1
          fi

      - name: Create per-RID archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _release

          # tar.gz targets — POSIX RIDs.
          for rid in linux-x64 linux-musl-x64 linux-arm linux-musl-arm \
                     linux-arm64 linux-musl-arm64 linux-x86 \
                     osx-x64 osx-arm64 freebsd-x64; do
            src="_artifacts/${rid}/net10.0/Readarr"
            if [ -d "$src" ]; then
              tar -C "_artifacts/${rid}/net10.0" -czf "_release/Librarr.${VERSION}.${rid}.tar.gz" Readarr
              echo "  packaged ${rid}"
            else
              echo "  WARN: missing ${src}, skipping ${rid}"
            fi
          done

          # zip targets — Windows.
          for rid in win-x64 win-x86; do
            src="_artifacts/${rid}/net10.0/Readarr"
            if [ -d "$src" ]; then
              (cd "_artifacts/${rid}/net10.0" && zip -qr "$GITHUB_WORKSPACE/_release/Librarr.${VERSION}.${rid}.zip" Readarr)
              echo "  packaged ${rid}"
            else
              echo "  WARN: missing ${src}, skipping ${rid}"
            fi
          done

          # macOS .app bundle variants (zip — preserves the bundle dir).
          for rid in osx-x64-app osx-arm64-app; do
            src="_artifacts/${rid}/net10.0"
            if [ -d "$src" ]; then
              (cd "$src" && zip -qr "$GITHUB_WORKSPACE/_release/Librarr.${VERSION}.${rid}.zip" Readarr.app)
              echo "  packaged ${rid}"
            fi
          done

      - name: Compute SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd _release
          # nullglob so *.exe vanishes rather than being passed through
          # literally when signing/installer output is absent. There is
          # always at least one tar.gz, so sha256sum never falls back to
          # reading stdin and hanging.
          shopt -s nullglob
          sha256sum *.tar.gz *.zip *.exe > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft GitHub release
        # TODO Phase 9b:
        #   * Notarize the .app bundles via `notarytool`
        #     (needs APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID secrets).
        #   * Sentry source-map upload (needs SENTRY_AUTH_TOKEN).
        env:
          GH_TOKEN: ${{ github.token }}
          # Whether the signing secret is configured, so the notes can say
          # what actually happened instead of claiming signatures that may
          # not exist. The value is a boolean, never the secret itself.
          WINDOWS_SIGNED: ${{ secrets.WINDOWS_CERT_PFX != '' }}
        shell: bash
        run: |
          # `gh release create` always creates a NEW release, and a draft
          # carries no git tag, so there is nothing for GitHub to collide
          # with -- re-running this workflow for a tag silently orphans the
          # previous draft instead of replacing it. v1.0.0-beta collected two
          # that way while this workflow was being debugged, one of them
          # created 22 minutes after the release had already been published.
          # Each orphan holds a full set of ~880 MB of artifacts that nobody
          # can download, because drafts are invisible without push access.
          #
          # Filtering happens in awk rather than in the --jq filter so the
          # tag comparison is an exact string match on a known-set variable,
          # with no interpolation into a jq program and no dependency on how
          # gh's jq resolves env lookups. One request, both answers.
          RELEASES=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | [(.draft|tostring), .tag_name, (.id|tostring)] | @tsv')

          # A published release is deliberately never touched -- it is the
          # thing users already hold checksums for. Stop instead, because
          # re-running the release job for a tag that has already shipped is
          # a mistake, and quietly producing a draft nobody can see is the
          # worst available way to report it.
          if printf '%s\n' "$RELEASES" \
             | awk -F'\t' -v tag="v${VERSION}" '$1=="false" && $2==tag {found=1} END {exit !found}'; then
            echo "::error::v${VERSION} is already published. Delete that release first if you really mean to rebuild it."
            exit 1
          fi

          printf '%s\n' "$RELEASES" \
            | awk -F'\t' -v tag="v${VERSION}" '$1=="true" && $2==tag {print $3}' \
            | while read -r stale_id; do
                echo "Removing stale draft release ${stale_id} for v${VERSION}"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${stale_id}"
              done

          # Mark anything that isn't a plain x.y.z as a prerelease, or GitHub
          # serves a beta as "Latest" and every tool that reads
          # /releases/latest picks it up as stable.
          PRERELEASE=""
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE="--prerelease"
          fi

          # Windows assets are produced by the build-windows and installer
          # jobs on windows-2022 runners. Releases up to 1.1.0-beta had none
          # and said so here; that note is gone because the gap is closed.
          # Built with printf rather than a multi-line string literal: every
          # line inside a `run: |` block must stay indented, and a bare line
          # at column 0 silently ends the YAML block scalar.
          if [ "${WINDOWS_SIGNED}" = "true" ]; then
            SIGNING_NOTE='The Windows binaries and installers are Authenticode-signed.'
          else
            SIGNING_NOTE='The Windows binaries are not code-signed, so SmartScreen will warn on first run — choose "More info" then "Run anyway", or verify the checksum above instead.'
          fi

          printf '%s\n' \
            'Verify downloads against `SHA256SUMS` before installing. Upgrading from Readarr: see `docs/migrating-from-readarr.md`.' \
            '' \
            'Windows users have two options: `Librarr.<version>.win-x64-installer.exe` installs to `%ProgramData%\Librarr` and can register the Windows service for you, or the `win-x64` / `win-x86` zips are a portable build — unzip and run `Readarr.exe` (tray) or `Readarr.Console.exe`.' \
            '' \
            "${SIGNING_NOTE}" \
            > _release_notes.md

          # nullglob keeps an absent installer from being passed to gh as the
          # literal string `_release/*.exe`, which it would treat as a missing
          # file and fail on.
          shopt -s nullglob
          ASSETS=(_release/*.tar.gz _release/*.zip _release/*.exe _release/SHA256SUMS)

          gh release create "v${VERSION}" \
            --title "Librarr ${VERSION}" \
            --notes-file _release_notes.md \
            --draft $PRERELEASE \
            "${ASSETS[@]}"

  docker-multiarch:
    name: Docker multi-arch
    # `package`, not just the build jobs. This job used to need only
    # build-backend and build-frontend -- neither of whose output it uses --
    # so it pushed public images even when packaging or the draft release
    # had failed, leaving registries holding a version that had no release.
    needs: [variables, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write    # push to ghcr.io
    env:
      VERSION: ${{ needs.variables.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once for the runner's own platform and load it into the local
      # daemon, so there is something to start. Nothing has been pushed and
      # nobody has logged in to a registry yet: the logins sit below the
      # smoke test on purpose, so a broken image fails this job before the
      # credentials are even in play.
      #
      # No `platforms:` -- buildx then builds for the builder's native
      # platform, which is the only one `load` can hand to the daemon and
      # the only one that runs here without emulation. Same Dockerfile and
      # build-args as the push below, in the same builder, so the multi-arch
      # build reuses these layers rather than building amd64 a second time:
      # the amd64 image that gets pushed is the one that was started here.
      - name: Build image for the runner's platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: distribution/docker/Dockerfile
          load: true
          push: false
          provenance: false
          tags: librarr:smoke
          build-args: |
            LIBRARR_VERSION=${{ needs.variables.outputs.version }}
            BUILD_BRANCH=${{ needs.variables.outputs.branch }}
          cache-from: type=gha

      - name: Smoke-test the image
        # Start it, wait for /ping, check it reports the version being
        # released, stop it. The version check is what catches an image
        # that boots but was stamped with the 10.0.0.* placeholder -- which
        # the app treats as an unofficial build (see the Dockerfile).
        shell: bash
        run: |
          set -euo pipefail

          name=librarr-smoke
          # 127.0.0.1 rather than localhost: the port is published on the
          # IPv4 loopback only, and localhost may resolve to ::1 first.
          host=http://127.0.0.1:8787

          finish() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Container log"
              docker logs "$name" 2>&1 | tail -n 200 || true
              echo "::endgroup::"
            fi
            docker rm -f "$name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap finish EXIT

          docker run -d --name "$name" -p 127.0.0.1:8787:8787 librarr:smoke >/dev/null

          # First boot creates the database and runs every migration.
          up=0
          for _ in $(seq 1 180); do
            if curl -fsS "$host/ping" >/dev/null 2>&1; then
              up=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' "$name" 2>/dev/null)" != "true" ]; then
              echo "::error::The container exited before answering /ping."
              exit 1
            fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then
            echo "::error::The container never answered ${host}/ping."
            exit 1
          fi
          echo "/ping answered"

          # /api needs the key the app generated on first start.
          api_key=$(docker exec "$name" cat /config/config.xml \
            | sed -n 's/.*<ApiKey>\(.*\)<\/ApiKey>.*/\1/p')
          if [ -z "$api_key" ]; then
            echo "::error::No ApiKey in /config/config.xml."
            exit 1
          fi

          reported=$(curl -fsS -H "X-Api-Key: ${api_key}" "$host/api/v1/system/status" | jq -r '.version')

          # The image is stamped with the version minus its pre-release
          # word (1.2.3-beta -> 1.2.3, 1.0.0-beta.4 -> 1.0.0.4), by the
          # same sed the Dockerfile and build.sh use. An assembly version
          # always has four parts, so pad both sides before comparing.
          pad() {
            local IFS=.
            local -a parts
            read -r -a parts <<< "$1"
            while [ "${#parts[@]}" -lt 4 ]; do parts+=(0); done
            echo "${parts[*]}"
          }
          expected=$(pad "$(printf '%s' "${VERSION}" | sed 's/-[A-Za-z][A-Za-z0-9]*//')")
          reported_padded=$(pad "$reported")

          echo "expected version: ${expected}"
          echo "reported version: ${reported_padded} (raw: ${reported})"
          if [ "$reported_padded" != "$expected" ]; then
            echo "::error::The image reports version ${reported}, but this release is ${VERSION} (${expected}). Not pushing it."
            exit 1
          fi

          docker stop "$name" >/dev/null
          echo "Smoke test passed."

      - name: Log in to GHCR
        # Zero-config — uses the workflow's built-in GITHUB_TOKEN. This
        # job's `permissions:` block declares `packages: write`.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        # Unconditional — assumes DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
        # are set as repo secrets. If they ever go missing the step
        # fails loudly (matching the GHCR step's "fail-fast" behavior).
        # Earlier attempt at `if: secrets.X != ''` gating broke workflow
        # validation, so we drop the conditional entirely now that
        # secrets are provisioned.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        # Every rule reads the computed version, never the ref. The rules
        # used to be `type=ref,event=tag`, `type=semver` with no value, and
        # two raw tags gated on github.ref_name. On a manual run the ref is
        # a branch, so the first three produced nothing and the :latest
        # gate -- "ref_name does not contain beta" -- was true for a beta
        # dispatched from main.
        #
        # For a tag push the result is unchanged: v1.2.3-beta still yields
        # :1.2.3-beta, :v1.2.3-beta and :beta; 1.3.0 yields :1.3.0, :1.3,
        # :v1.3.0 and :latest. (metadata-action emits {{major}}.{{minor}}
        # only for a non-prerelease version.) `latest=false` turns off the
        # action's own guess so the explicit rule below is the only source.
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/librarr
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/librarr
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.variables.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.variables.outputs.version }}
            type=raw,value=v${{ needs.variables.outputs.version }}
            type=raw,value=latest,enable=${{ needs.variables.outputs.channel == 'stable' }}
            type=raw,value=beta,enable=${{ needs.variables.outputs.channel == 'beta' }}
          labels: |
            org.opencontainers.image.title=Librarr
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build + push image (amd64 + arm64 + armv7)
        # The Dockerfile maps TARGETARCH → musl RID itself and pins both
        # build stages to $BUILDPLATFORM, so all three arches cross-compile
        # on the amd64 runner. Do NOT pass DOTNET_RID here — a single
        # build-arg applies to every platform and would pin all three
        # manifest entries to the same RID.
        #
        # Only the amd64 image was started above. The arm64 and arm/v7
        # images come from the same sources and the same Dockerfile, but
        # nothing here runs them.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: distribution/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LIBRARR_VERSION=${{ needs.variables.outputs.version }}
            BUILD_BRANCH=${{ needs.variables.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
