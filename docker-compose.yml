# Librarr — reference Compose file.
#
#   docker compose up -d          # pull the published image and run
#   docker compose up -d --build  # build from this checkout instead
#
# Every setting below is overridable from the environment (or a .env file
# next to this one, which is gitignored) so you never have to edit — and
# dirty — this tracked file:
#
#   LIBRARR_IMAGE        image to run; defaults to the :beta tag (see below)
#   PUID / PGID          host uid/gid Librarr runs as (default 1000:1000). The
#                        container starts as root, gives /config to this
#                        user, then drops to it — files it writes under
#                        /config, /books and /downloads are owned by it.
#                        /books and /downloads are never chowned: make sure
#                        this user can write to them on the host.
#   UMASK_SET            umask for files Librarr creates (002 here = group-
#                        writable; the image's own default is 022)
#   TZ                   e.g. America/Denver; defaults to UTC
#   LIBRARR_PORT         host port for the web UI (container side stays 8787)
#   LIBRARR_CONFIG       host path for persistent app data
#   LIBRARR_BOOKS        host path for your library root
#   LIBRARR_DOWNLOADS    host path where download clients drop completed grabs
#
# Example .env:
#   TZ=America/Denver
#   LIBRARR_BOOKS=/mnt/media/books
#
# Image tag: every release so far is a beta, so only `:beta` and the exact
# version tags (e.g. `:1.2.3-beta`) are published. `:latest` will exist once
# there is a stable release — until then pulling it fails.
#
# Prefer Docker's own `user:` over PUID/PGID? Add `user: "1000:1000"` to the
# service: the container then never runs as root, PUID/PGID are ignored, and
# the mounted directories must already be writable by that uid on the host.
#
# See distribution/docker/README.md for the multi-arch build instructions
# and the full volume/port/variable reference.

services:
  librarr:
    image: ${LIBRARR_IMAGE:-ghcr.io/rorqualx/librarr:beta}
    container_name: librarr
    build:
      context: .
      dockerfile: distribution/docker/Dockerfile
      # No DOTNET_RID: the Dockerfile maps TARGETARCH to the musl RID itself,
      # and Compose sets TARGETARCH from the host. To build for a different
      # architecture, add a `platform:` key or use `docker buildx bake`.
      args:
        LIBRARR_VERSION: ${LIBRARR_VERSION:-1.0.0-beta.0}
    ports:
      - "${LIBRARR_PORT:-8787}:8787"
      - "${LIBRARR_SSL_PORT:-6868}:6868"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - UMASK_SET=${UMASK_SET:-002}
    volumes:
      - ${LIBRARR_CONFIG:-./docker-config}:/config
      - ${LIBRARR_BOOKS:-./docker-books}:/books
      - ${LIBRARR_DOWNLOADS:-./docker-downloads}:/downloads
    restart: unless-stopped
